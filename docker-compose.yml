services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=gridwars
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gridwars"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: grid-wars-api
    build:
      context: ./backend
    restart: always
    ports:
      - "8052:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/gridwars
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: grid-wars-frontend
    build:
      context: ./frontend
    restart: always
    ports:
      - "8051:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db_data: