version: '3.8'

services:
  api:
    build: ./backend
    container_name: gridwars_api
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/gridwars
    ports:
      - "8000:8000"
    volumes:
      - "./backend:/app"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: gridwars_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gridwars
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    build: ./frontend
    container_name: gridwars_frontend
    ports:
      - "8080:80"
    depends_on:
      - api
      
volumes:
  db_data:     