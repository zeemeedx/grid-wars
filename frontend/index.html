<!DOCTYPE html>
<html>

<head>
    <title>GridWars</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script type="module">
        import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            setup() {
                const grade = ref(Array(100).fill(false))
                const itemSelecionado = ref(false)
                const isDrawing = ref(false)

                const toggleSelecao = () => { itemSelecionado.value = !itemSelecionado.value }

                const pintar = (index) => {
                    if (itemSelecionado.value && isDrawing.value) grade.value[index] = true
                }

                const iniciarDesenho = (index) => {
                    isDrawing.value = true
                    pintar(index)
                }

                const pararDesenho = () => {
                    isDrawing.value = false
                }

                return {
                    grade,
                    itemSelecionado,
                    isDrawing,
                    toggleSelecao,
                    pintar,
                    iniciarDesenho,
                    pararDesenho
                }
            }
        }).mount('#app')
    </script>

    <div id="app">
        <div class="inventory">
            <div class="item" :class="{ selected: itemSelecionado }" @click="toggleSelecao"></div>
        </div>

        <div class="grid" @mouseup.window="pararDesenho">
            <div v-for="(ativo, index) in grade" :key="index"
                 class="cell" :class="{ active: ativo }"
                 @mousedown="iniciarDesenho(index)"
                 @mouseenter="pintar(index)">
            </div>
        </div>
    </div>
</body>

</html>
