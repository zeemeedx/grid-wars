<!DOCTYPE html>
<html>
<head>
    <title>GridWars - Menu</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="menu-container">
        <div v-if="user" class="user-info">
            <span>👤 {{ user.username }} (⭐ {{ user.points }} | 🪙 {{ user.coins }})</span>
            <button class="logout-btn" @click="logout">Sair</button>
        </div>
        <h1 class="main-title">GridWars</h1>
        
        <div class="menu-buttons">
            <button class="menu-btn" @click="irParaCriar">Criar</button>
            <button class="menu-btn" @click="irParaMapas(false)">Jogar Mapas</button>
            <button class="menu-btn" @click="irParaMapas(true)">Meus Mapas</button>
            <button class="menu-btn" @click="verRanking">Ver Ranking</button>
        </div>

        <div v-if="mostrarRanking" class="ranking-box">
            <div class="ranking-tabs">
                <button :class="{ active: rankingTipo === 'points' }" @click="setRankingTipo('points')">Melhores Jogadores</button>
                <button :class="{ active: rankingTipo === 'maps' }" @click="setRankingTipo('maps')">Maiores Criadores</button>
            </div>

            <h2 v-if="rankingTipo === 'points'">Ranking por Pontos</h2>
            <h2 v-else>Ranking por Criações</h2>

            <ul v-if="jogadores.length > 0">
                <li v-for="(player, index) in jogadores" :key="player.id">
                    <strong>{{ index + 1 }}º</strong> {{ player.username }} 
                    <span v-if="rankingTipo === 'points'">({{ player.points }} pontos)</span>
                    <span v-else>({{ player.map_count }} mapas)</span>
                </li>
            </ul>
            <p v-else>Nenhum jogador encontrado.</p>
        </div>

    </div>

    <script type="module">
        import { createApp, ref, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            setup() {
                const user = ref(null)
                const mostrarRanking = ref(false)
                const rankingTipo = ref('points')
                const jogadores = ref([])

                const checkAuth = async () => {
                    const token = localStorage.getItem('token')
                    if (!token) {
                        window.location.href = 'auth.html'
                        return
                    }

                    try {
                        const response = await fetch('http://localhost:8000/users/me', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        })
                        if (response.ok) {
                            user.value = await response.json()
                        } else {
                            localStorage.removeItem('token')
                            window.location.href = 'auth.html'
                        }
                    } catch (error) {
                        console.error("Erro na autenticação:", error)
                        window.location.href = 'auth.html'
                    }
                }

                onMounted(checkAuth)

                const logout = () => {
                    localStorage.removeItem('token')
                    window.location.href = 'auth.html'
                }

                const irParaCriar = () => {
                    window.location.href = 'editor.html'
                }

                const irParaMapas = (mine) => {
                    const url = mine ? `maps.html?mine=true` : 'maps.html'
                    window.location.href = url
                }

                const verRanking = async () => {
                    mostrarRanking.value = true
                    try {
                        const response = await fetch(`http://localhost:8000/players/?sort_by=${rankingTipo.value}`)
                        if (response.ok) {
                            jogadores.value = await response.json()
                        }
                    } catch (error) {
                        console.error("Erro ao buscar o ranking da API:", error)
                    }
                }

                const setRankingTipo = (tipo) => {
                    rankingTipo.value = tipo
                    verRanking()
                }

                return { user, logout, mostrarRanking, rankingTipo, jogadores, irParaCriar, irParaMapas, verRanking, setRankingTipo }
            }
        }).mount('#app')
    </script>
</body>
</html>
