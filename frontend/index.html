<!DOCTYPE html>
<html>
<head>
    <title>GridWars - Menu</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="menu-container">
        <h1 class="main-title">GridWars</h1>
        
        <div class="menu-buttons">
            <button class="menu-btn" @click="irParaCriar">Criar</button>
            <button class="menu-btn" @click="irParaMapas">Jogar Mapas</button>
            <button class="menu-btn" @click="verRanking">Ver Ranking</button>
        </div>

        <div v-if="mostrarRanking" class="ranking-box">
            <h2>Ranking</h2>
            <ul v-if="jogadores.length > 0">
                <li v-for="(player, index) in jogadores" :key="player.id">
                    <strong>{{ index + 1 }}º</strong> - {{ player.name }} ({{ player.coins }} moedas)
                </li>
            </ul>
            <p v-else>Nenhum jogador encontrado.</p>
        </div>
    </div>

    <script type="module">
        import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            setup() {
                const mostrarRanking = ref(false)
                const jogadores = ref([])

                const irParaCriar = () => {
                    window.location.href = 'editor.html'
                }

                const irParaMapas = () => {
                    window.location.href = 'maps.html'
                }

                const verRanking = async () => {
                    mostrarRanking.value = true
                    try {
                        const response = await fetch('http://localhost:8000/players/')
                        if (response.ok) {
                            jogadores.value = await response.json()
                        }
                    } catch (error) {
                        console.error("Erro ao buscar o ranking da API:", error)
                    }
                }

                return { mostrarRanking, jogadores, irParaCriar, irParaMapas, verRanking }
            }
        }).mount('#app')
    </script>
</body>
</html>
