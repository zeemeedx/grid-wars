<!DOCTYPE html>
<html>

<head>
    <title>GridWars</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script type="module">
        import { createApp, ref, onMounted, onUnmounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            setup() {
                const grade = ref(Array(100).fill(0))
                const itemSelecionado = ref(null)
                const borrachaSelecionada = ref(false)
                const planejarTrajeto = ref(false)
                const mostrarPlay = ref(false)
                const isDrawing = ref(false)
                const isPlaying = ref(false)
                const playerPos = ref(0)
                const rotaPlanejada = ref([0])
                const mostrarVitoria = ref(false)

                const moedas = ref(0)
                const itensBloqueados = ref({
                    1: false,
                    2: false,
                    3: true
                })
                const precos = {
                    3: 50
                }

                const togglePlanejador = () => {
                    planejarTrajeto.value = !planejarTrajeto.value
                    if (planejarTrajeto.value) {
                        itemSelecionado.value = null
                        borrachaSelecionada.value = false
                        playerPos.value = 0
                        rotaPlanejada.value = [0]
                        mostrarPlay.value = false
                    }
                }
            
                const moverJogador = (event) => {
                    if (!planejarTrajeto.value || mostrarPlay.value) return

                    const tecla = event.key.toLowerCase()
                    let novaPos = playerPos.value

                    if (tecla == 'w' && playerPos.value >= 10) novaPos -= 10
                    else if (tecla == 's' && playerPos.value <= 89) novaPos += 10
                    else if (tecla == 'a' && playerPos.value % 10 !== 0) novaPos -= 1
                    else if (tecla == 'd' && playerPos.value % 10 !== 9) novaPos += 1

                    if (grade.value[novaPos] === 1) return
                    
                    if (novaPos !== playerPos.value) {
                        playerPos.value = novaPos
                        rotaPlanejada.value.push(novaPos)

                        if (grade.value[novaPos] === -2) {
                            mostrarPlay.value = true
                        }
                    }
                }

                const executarPlay = () => {
                    mostrarPlay.value = false
                    planejarTrajeto.value = false
                    playerPos.value = rotaPlanejada.value[0]
                    isPlaying.value = true

                    let passo = 1
                    const velocidade = 300

                    const intervalo = setInterval(() => {
                        if (passo < rotaPlanejada.value.length) {
                            playerPos.value = rotaPlanejada.value[passo]
                            passo++
                        } else {
                            clearInterval(intervalo)
                            isPlaying.value = false

                            if (grade.value[playerPos.value] === -2) {
                                mostrarVitoria.value = true
                                moedas.value += 10
                            }
                        }
                    }, velocidade)
                }

                const continuarEditando = () => {
                    mostrarVitoria.value = false
                    planejarTrajeto.value = false
                    playerPos.value = 0
                    rotaPlanejada.value = [0]
                }

                const salvarMapa = async () => {
                    try {
                        await fetch("http://localhost:8000/maps/", {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ grid: grade.value })
                        })
                        alert("Mapa salvo no banco de dados.")
                        continuarEditando()
                    } catch (error) {
                        console.error("Erro ao salvar: ", error)
                    }
                }

                const voltar = () => {
                    window.location.href = 'index.html'
                }

                onMounted(async () => {
                    window.addEventListener('keydown', moverJogador)
                    
                    const urlParams = new URLSearchParams(window.location.search)
                    const mapId = urlParams.get('map_id')
                    
                    if (mapId) {
                        try {
                            const response = await fetch(`http://localhost:8000/maps/${mapId}`)
                            if (response.ok) {
                                const mapData = await response.json()
                                if (mapData.grid) {
                                    grade.value = mapData.grid
                                    grade.value[99] = -2 // Ensures target remains
                                }
                            }
                        } catch (error) {
                            console.error("Erro ao carregar mapa: ", error)
                        }
                    }
                })
                onUnmounted(() => window.removeEventListener('keydown', moverJogador))

                grade.value[99] = -2

                const selecionarItem = (id) => {
                    if (itensBloqueados.value[id]) {
                        if (moedas.value >= precos[id]) {
                            moedas.value -= precos[id]
                            itensBloqueados.value[id] = false
                        } else {
                            alert(`Moedas insuficientes! Custa ${precos[id]} moedas.`)
                        }
                        return
                    }
                    itemSelecionado.value = id
                    borrachaSelecionada.value = false
                }

                const toggleBorracha = () => {
                    borrachaSelecionada.value = !borrachaSelecionada.value
                    if (borrachaSelecionada.value) itemSelecionado.value = null
                }

                const pintar = (index) => {
                    if (!isDrawing.value) return
                    if (index === 0 || index === 99) return

                    if (itemSelecionado.value !== null) {
                        grade.value[index] = itemSelecionado.value
                    } else if (borrachaSelecionada.value) {
                        grade.value[index] = 0
                    }

                    grade.value[99] = -2
                }

                const iniciarDesenho = (index) => {
                    isDrawing.value = true
                    pintar(index)
                }

                const pararDesenho = () => {
                    isDrawing.value = false
                }

                return {
                    moedas,
                    itensBloqueados,
                    precos,
                    grade,
                    itemSelecionado,
                    borrachaSelecionada,
                    isDrawing,
                    isPlaying,
                    playerPos,
                    planejarTrajeto,
                    mostrarPlay,
                    mostrarVitoria,
                    rotaPlanejada,
                    selecionarItem,
                    toggleBorracha,
                    pintar,
                    iniciarDesenho,
                    pararDesenho,
                    moverJogador,
                    togglePlanejador,
                    executarPlay,
                    continuarEditando,
                    salvarMapa,
                    voltar
                }
            }
        }).mount('#app')
    </script>

    <div id="app">
        <button class="back-btn" @click="voltar">⬅ Voltar</button>
        <div class="inventory">
            <div class="item type-1" :class="{ selected: itemSelecionado === 1 }" @click="selecionarItem(1)"></div>
            <div class="item type-2" :class="{ selected: itemSelecionado === 2 }" @click="selecionarItem(2)"></div>
            <div class="item type-3" :class="{ selected: itemSelecionado === 3, locked: itensBloqueados[3] }" @click="selecionarItem(3)">
                <span v-if="itensBloqueados[3]" class="price">{{ precos[3] }}🪙</span>
            </div>
        </div>

        <div class="grid" @mouseup.window="pararDesenho">
            <div class="coins-display">🪙{{ moedas }}</div>
            <div class="erase" :class="{ selected: borrachaSelecionada }" @click="toggleBorracha">🗑️</div>
            <div class="plan" :class="{ selected: planejarTrajeto }" @click="togglePlanejador">✏️</div>
            <div class="play" v-if="mostrarPlay" @click="executarPlay">▶️</div>

            <div class="popup" v-if="mostrarVitoria">
                <h2>Você venceu! Parabéns!</h2>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button @click="salvarMapa">Salvar Mapa</button>
                    <button @click="continuarEditando">Continuar Editando</button>
                </div>
            </div>

            <div v-for="(tipo, index) in grade" :key="index"
                class="cell" :class="['type-' + tipo, { 'has-player': index === playerPos, 'is-trail': (planejarTrajeto || isPlaying) && rotaPlanejada.includes(index) }]"
                @mousedown="iniciarDesenho(index)"
                @mouseenter="pintar(index)">
            </div>
        </div>
    </div>
</body>

</html>
