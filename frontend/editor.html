<!DOCTYPE html>
<html>

<head>
    <title>GridWars</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script type="module">
        import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            setup() {
                const grade = ref(Array(100).fill(0))
                const itemSelecionado = ref(null)
                const borrachaSelecionada = ref(false)
                const isDrawing = ref(false)

                const selecionarItem = (id) => {
                    itemSelecionado.value = id
                    borrachaSelecionada.value = false
                }

                const toggleBorracha = () => {
                    borrachaSelecionada.value = !borrachaSelecionada.value
                    if (borrachaSelecionada.value) itemSelecionado.value = null
                }

                const pintar = (index) => {
                    if (!isDrawing.value) return

                    if (itemSelecionado.value !== null) {
                        grade.value[index] = itemSelecionado.value
                    } else if (borrachaSelecionada.value) {
                        grade.value[index] = 0
                    }

                    grade.value[0] = 0
                    grade.value[99] = 0
                }

                const iniciarDesenho = (index) => {
                    isDrawing.value = true
                    pintar(index)
                }

                const pararDesenho = () => {
                    isDrawing.value = false
                }

                return {
                    grade,
                    itemSelecionado,
                    borrachaSelecionada,
                    isDrawing,
                    selecionarItem,
                    toggleBorracha,
                    pintar,
                    iniciarDesenho,
                    pararDesenho
                }
            }
        }).mount('#app')
    </script>

    <div id="app">
        <div class="inventory">
            <div class="item type-1" :class="{ selected: itemSelecionado === 1 }" @click="selecionarItem(1)"></div>
            <div class="item type-2" :class="{ selected: itemSelecionado === 2 }" @click="selecionarItem(2)"></div>
        </div>

        <div class="grid" @mouseup.window="pararDesenho">
            <div class="erase" :class="{ selected: borrachaSelecionada }" @click="toggleBorracha">
                🗑️
            </div>

            <div v-for="(tipo, index) in grade" :key="index"
                class="cell" :class="'type-' + tipo"
                @mousedown="iniciarDesenho(index)"
                @mouseenter="pintar(index)">
            </div>
        </div>
    </div>
</body>

</html>
