<!DOCTYPE html>
<html>

<head>
    <title>GridWars</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div id="app">
        <button class="back-btn" @click="voltar">⬅ Voltar</button>
        <div class="editor-controls" v-if="!isReadOnly">
            <div class="toggle-container">
                <button v-if="itemSelecionado === 3" class="toggle-dir" @click="toggleEnemyDirection">
                    Alternar Direção: {{ enemyDirection === 'h' ? '↔️' : '↕️' }}
                </button>
                <button v-if="[5, 7, 8].includes(itemSelecionado)" class="toggle-dir" @click="togglePortalColor">
                    Alternar Cor: {{ getPortalEmoji() }}
                </button>
            </div>
            <div class="inventory">
                <div class="item type-1" :class="{ selected: itemSelecionado === 1 }" @click="selecionarItem(1)"></div>
                <div class="item type-2" :class="{ selected: itemSelecionado === 2 }" @click="selecionarItem(2)"></div>
                <div class="item type-3" :class="{ selected: itemSelecionado === 3, locked: itensBloqueados[3] }" @click="selecionarItem(3)">
                    <span v-if="itensBloqueados[3]" class="price">{{ precos[3] }}🪙</span>
                    <span v-else>{{ enemyDirection === 'h' ? '↔️' : '↕️' }}</span>
                </div>
                <div class="item" :class="['type-' + portalColor, { selected: [5, 7, 8].includes(itemSelecionado), locked: itensBloqueados[5] }]" @click="selecionarItem(5)">
                    <span v-if="itensBloqueados[5]" class="price">{{ precos[5] }}🪙</span>
                    <span v-else>{{ getPortalEmoji() }}</span>
                </div>
                <div class="item type-6" :class="{ selected: itemSelecionado === 6, locked: itensBloqueados[6] }" @click="selecionarItem(6)">
                    <span v-if="itensBloqueados[6]" class="price">{{ precos[6] }}🪙</span>
                    <span v-else>🕸️</span>
                </div>
            </div>
        </div>

        <div class="grid" @mouseup.window="pararDesenho">
            <div class="coins-display">🪙{{ moedas }} ⭐{{ pontos }}</div>
            <div class="erase" v-if="!isReadOnly" :class="{ selected: borrachaSelecionada }" @click="toggleBorracha">🗑️</div>
            <div class="plan" :class="{ selected: planejarTrajeto }" @click="togglePlanejador">✏️</div>
            <div class="play" v-if="mostrarPlay" @click="executarPlay">▶️</div>

            <div v-if="mostrarVitoria" class="popup">
                <h2>Você venceu! Parabéns!</h2>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button v-if="!isReadOnly" @click="salvarMapa">Salvar Mapa</button>
                    <button @click="continuarEditando">{{ isReadOnly ? 'Jogar Novamente' : 'Continuar Editando' }}</button>
                </div>
            </div>

            <div v-for="(tipo, index) in grade" :key="index"
                class="cell" :class="['type-' + tipo, { 'has-player': index === playerPos, 'is-trail': (planejarTrajeto || isPlaying) && rotaPlanejada.includes(index) }]"
                @mousedown="iniciarDesenho(index)"
                @mouseenter="pintar(index)">
                <span v-if="tipo === 3">↔️</span>
                <span v-if="tipo === 4">↕️</span>
                <span v-if="tipo === 5">🌀</span>
                <span v-if="tipo === 7">🟠</span>
                <span v-if="tipo === 8">🟢</span>
                <span v-if="tipo === 6">🕸️</span>
            </div>
        </div>
    </div>
    <script type="module" src="/src/editor.ts"></script>
</body>

</html>
