<!DOCTYPE html>
<html>
<head>
    <title>GridWars - Login</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="auth-container">
        <h1 class="main-title">GridWars</h1>
        <h2 v-if="isLogin">Login</h2>
        <h2 v-else>Criar Conta</h2>

        <form @submit.prevent="handleAuth" class="auth-form">
            <input type="text" v-model="username" placeholder="Usuário" required>
            <input type="password" v-model="password" placeholder="Senha" required>
            <button type="submit">{{ isLogin ? 'Entrar' : 'Cadastrar' }}</button>
        </form>

        <p class="auth-toggle" @click="isLogin = !isLogin">
            {{ isLogin ? 'Não tem conta? Crie uma!' : 'Já tem conta? Faça login!' }}
        </p>
    </div>

    <script type="module">
        import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            setup() {
                const isLogin = ref(true)
                const username = ref('')
                const password = ref('')

                const handleAuth = async () => {
                    const endpoint = isLogin.value ? 'token' : 'register'
                    
                    try {
                        let body;
                        let headers = {};

                        if (isLogin.value) {
                            // OAuth2PasswordRequestForm expects form-data
                            const formData = new FormData();
                            formData.append('username', username.value);
                            formData.append('password', password.value);
                            body = formData;
                        } else {
                            body = JSON.stringify({ username: username.value, password: password.value });
                            headers['Content-Type'] = 'application/json';
                        }

                        const response = await fetch(`http://localhost:8000/${endpoint}`, {
                            method: 'POST',
                            headers: headers,
                            body: body
                        })

                        if (response.ok) {
                            const data = await response.json()
                            if (isLogin.value) {
                                localStorage.setItem('token', data.access_token)
                                window.location.href = 'index.html'
                            } else {
                                alert('Conta criada com sucesso! Agora faça login.')
                                isLogin.value = true
                                password.value = ''
                            }
                        } else {
                            const error = await response.json()
                            alert(error.detail || 'Erro na autenticação')
                        }
                    } catch (error) {
                        console.error("Erro:", error)
                        alert('Erro ao conectar com o servidor')
                    }
                }

                return { isLogin, username, password, handleAuth }
            }
        }).mount('#app')
    </script>
</body>
</html>
