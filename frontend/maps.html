<!DOCTYPE html>
<html>
<head>
    <title>GridWars - Mapas</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="back-btn" onclick="window.location.href='index.html'">⬅ Voltar</button>
    <div id="app" class="menu-container">
        <h1 class="main-title">{{ isMine ? 'Meus Mapas' : 'Mapas Criados' }}</h1>
        
        <div class="ranking-box">
            <ul v-if="mapas.length > 0" class="maps-list">
                <li v-for="mapa in mapas" :key="mapa.id" @click="jogarMapa(mapa.id)" class="map-item">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <strong>Mapa #{{ mapa.id }}</strong>
                        <span v-if="mapa.completed" title="Concluído">✅</span>
                    </div>
                    <span>Criado por: {{ mapa.owner_username }}</span>
                    <span v-if="!isMine">Recompensa: ⭐ {{ mapa.points }} | 🪙 {{ Math.floor(mapa.points / 2) }}</span>
                    <div class="mini-grid">
                        <div v-for="(tipo, index) in mapa.grid" :key="index" :class="['mini-cell', 'type-' + tipo]"></div>
                    </div>
                </li>
            </ul>
            <p v-else>Nenhum mapa encontrado.</p>
        </div>
    </div>

    <script type="module">
        import { createApp, ref, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            setup() {
                const mapas = ref([])
                const isMine = ref(false)

                const carregarMapas = async () => {
                    const urlParams = new URLSearchParams(window.location.search)
                    isMine.value = urlParams.get('mine') === 'true'
                    const token = localStorage.getItem('token')
                    
                    let url = 'http://localhost:8000/maps/'
                    if (isMine.value) {
                        try {
                            const userRes = await fetch('http://localhost:8000/users/me', {
                                headers: { 'Authorization': `Bearer ${token}` }
                            })
                            if (userRes.ok) {
                                const userData = await userRes.json()
                                url += `?owner_id=${userData.id}`
                            }
                        } catch (e) { console.error(e) }
                    }

                    try {
                        const response = await fetch(url, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        })
                        if (response.ok) {
                            const allMaps = await response.json()
                            if (isMine.value) {
                                mapas.value = allMaps
                            } else {
                                // Filter out mine if it's "Jogar Mapas"
                                const userRes = await fetch('http://localhost:8000/users/me', {
                                    headers: { 'Authorization': `Bearer ${token}` }
                                })
                                if (userRes.ok) {
                                    const userData = await userRes.json()
                                    mapas.value = allMaps.filter(m => m.owner_id !== userData.id)
                                } else {
                                    mapas.value = allMaps
                                }
                            }
                        }
                    } catch (error) {
                        console.error("Erro ao buscar mapas da API:", error)
                    }
                }

                const jogarMapa = (id) => {
                    const mode = isMine.value ? 'edit' : 'play'
                    window.location.href = `editor.html?map_id=${id}&mode=${mode}`
                }

                onMounted(() => {
                    carregarMapas()
                })

                return { mapas, jogarMapa, isMine }
            }
        }).mount('#app')
    </script>
</body>
</html>
